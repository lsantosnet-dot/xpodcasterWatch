name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e APK de debug
        run: ./gradlew :wear:testDebugUnitTest :wear:assembleDebug
      - name: Renomear APK
        run: |
          mkdir -p dist
          cp wear/build/outputs/apk/debug/wear-debug.apk dist/XPodcasterWatch-relogio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: xpodcaster-watch-apk
          path: dist/*.apk
      - name: Publicar no Release "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: XPodcaster Watch (build mais recente)
          body: |
            APK de debug gerado automaticamente a partir do commit ${{ github.sha }}.
            Relógio (Wear OS): XPodcasterWatch-relogio.apk
          make_latest: true
          files: dist/*.apk
      - name: Atualizar a tag latest para este commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest
